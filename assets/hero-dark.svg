<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="markup-foundations — first principles of markup for content authoring">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style><![CDATA[
      .wm    { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
      .tag   { font-family: ui-monospace, "SF Mono", Consolas, "Liberation Mono", "Courier New", monospace; font-weight: 600; letter-spacing: 0.22em; }
      .label { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-weight: 700; letter-spacing: 0.18em; }
    ]]></style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Subtle corner accents -->
  <g stroke="#30363d" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M 24 24 L 24 56 M 24 24 L 56 24"/>
    <path d="M 1176 24 L 1176 56 M 1176 24 L 1144 24"/>
    <path d="M 24 336 L 24 304 M 24 336 L 56 336"/>
    <path d="M 1176 336 L 1176 304 M 1176 336 L 1144 336"/>
  </g>

