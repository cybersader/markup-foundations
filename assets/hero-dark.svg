  </g>

  <!-- Wordmark -->
  <text x="600" y="222" text-anchor="middle" class="wm" font-size="48" fill="#f0f6fc">markup-foundations</text>

  <!-- Tagline -->
  <text x="600" y="252" text-anchor="middle" class="tag" font-size="11" fill="#8b949e">
    FIRST PRINCIPLES · CONTENT AUTHORING · DURABLE MARKUP
  </text>

  <!-- Gradient bar -->
  <rect x="240" y="298" width="720" height="3" fill="url(#stripe)" rx="1.5"/>

  <!-- Zone dots, pulse in sequence -->
  <g>
    <circle cx="240" cy="299.5" r="9" fill="#ef4444" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="384" cy="299.5" r="9" fill="#f97316" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="528" cy="299.5" r="9" fill="#eab308" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="672" cy="299.5" r="9" fill="#22c55e" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="816" cy="299.5" r="9" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="299.5" r="9" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="3.6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HOT / COLD labels -->
  <text x="200" y="304" text-anchor="end" class="label" font-size="11" fill="#8b949e">HOT</text>
  <text x="1000" y="304" text-anchor="start" class="label" font-size="11" fill="#8b949e">COLD</text>
</svg>
